services:
  database:
    image: postgres:18
    environment:
      POSTGRES_USER: workorder
      POSTGRES_PASSWORD: workorder
      POSTGRES_DB: workorder
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - workorder_database:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workorder"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  workorder_database:
