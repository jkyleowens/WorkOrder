<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;700&family=Barlow+Condensed:wght@600&display=swap">
  <style>
    body { margin: 0; background: #f2f2f3; color: #1d1f20; font-family: Barlow, system-ui, sans-serif; font-size: 15px; line-height: 1.45; }
    a { color: #416180; text-decoration: none; } a:hover { color: #2c455d; }
    h1, h2, h3 { font-family: "Barlow Condensed", "Arial Narrow", sans-serif; font-weight: 600; letter-spacing: -0.015em; margin: 0; }
    p { margin: 0; }
    .cap { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: #5d6065; font-weight: 500; padding: 12px 16px 4px; }
    .row { display: flex; align-items: center; gap: 14px; min-height: 48px; padding: 0 16px; color: #1d1f20; font-size: 15px; font-weight: 500; }
    .row svg.i { width: 20px; height: 20px; color: #416180; flex-shrink: 0; }
    .row span { flex-grow: 1; }
    .tab { flex: 1 1 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 11px; font-weight: 500; color: #5d6065; min-height: 64px; }
    .tab svg { width: 22px; height: 22px; }
    .tab.on { color: #2c455d; box-shadow: inset 0 2px #5980a6; background: #eef4fa; }
  </style>
</helmet>
<div style="width: 390px; height: 844px; display: flex; flex-direction: column; background: #f2f2f3; overflow: hidden; position: relative;">

  <header style="height: 56px; flex-shrink: 0; display: flex; align-items: center; padding: 0 16px; gap: 8px; background: #e9e9ea; border-bottom: 1px solid #d0d1d3;">
    <svg width="24" height="24" viewBox="0 0 48 48"><rect x="7" y="9" width="34" height="30" fill="none" stroke="#5980a6" stroke-width="2"></rect><path d="M7 19h34M19 19v20M3 9h8M7 5v8M37 39h8M41 35v8" fill="none" stroke="#1d1f20" stroke-width="1.5"></path></svg>
    <h1 style="font-size: 24px;">Overview</h1>
  </header>
  <div style="flex-grow: 1; padding: 16px; display: flex; flex-direction: column; gap: 12px;">
    <div style="height: 88px; background: #fafafb; border: 1px solid #d0d1d3;"></div>
    <div style="height: 180px; background: #fafafb; border: 1px solid #d0d1d3;"></div>
  </div>

  <div style="position: absolute; left: 0; right: 0; top: 0; bottom: 64px; background: rgba(29, 31, 32, 0.45);"></div>

  <section role="dialog" aria-label="More" style="position: absolute; left: 0; right: 0; bottom: 64px; background: #fafafb; border-top: 1px solid #d0d1d3; border-radius: 5px 5px 0 0; display: flex; flex-direction: column; padding-bottom: 8px;">
    <div style="width: 36px; height: 4px; background: #d0d1d3; border-radius: 2px; margin: 8px auto 0;"></div>
    <div style="display: flex; justify-content: space-between; align-items: center; padding: 4px 8px 4px 16px;">
      <h2 style="font-size: 25px;">More</h2>
      <a href="#" aria-label="Close" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 3px; background: #e9e9ea;"><svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="#5d6065" stroke-width="1.6"><path d="M5 5l10 10M15 5L5 15"></path></svg></a>
    </div>

    <div style="padding: 4px 16px 8px; display: flex; flex-direction: column; gap: 6px;">
      <span style="font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: #5d6065; font-weight: 500;">Working as</span>
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border: 1px solid #d0d1d3; border-radius: 3px; overflow: hidden;">
        <a href="#" style="min-height: 44px; display: flex; align-items: center; justify-content: center; font-size: 14px; color: #5d6065; border-right: 1px solid #d0d1d3;">Personal</a>
        <a href="#" style="min-height: 44px; display: flex; align-items: center; justify-content: center; font-size: 14px; color: #5d6065; border-right: 1px solid #d0d1d3;">Client</a>
        <a href="#" style="min-height: 44px; display: flex; align-items: center; justify-content: center; font-size: 14px; color: #ffffff; background: #416180; font-weight: 500;">Moreno Electric</a>
      </div>
    </div>

    <div class="cap">Money &amp; materials</div>
    <a href="#" class="row"><svg class="i" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="5" width="14" height="10"></rect><path d="M3 8.5h14M6 12h3"></path></svg><span>Billing</span><svg width="14" height="14" viewBox="0 0 16 16"><path d="M6 4l4 4-4 4" fill="none" stroke="#a8aaad" stroke-width="1.5"></path></svg></a>
    <a href="#" class="row"><svg class="i" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 6.5 10 3l7 3.5v7L10 17l-7-3.5z"></path><path d="M3 6.5 10 10l7-3.5M10 10v7"></path></svg><span>Inventory</span><svg width="14" height="14" viewBox="0 0 16 16"><path d="M6 4l4 4-4 4" fill="none" stroke="#a8aaad" stroke-width="1.5"></path></svg></a>

    <div class="cap">People</div>
    <a href="#" class="row"><svg class="i" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="7" width="14" height="9"></rect><path d="M7 7V4h6v3"></path></svg><span>Employment</span><svg width="14" height="14" viewBox="0 0 16 16"><path d="M6 4l4 4-4 4" fill="none" stroke="#a8aaad" stroke-width="1.5"></path></svg></a>
    <a href="#" class="row"><svg class="i" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 17V3h8v14M12 8h4v9M2 17h16M7 6h2M7 9h2M7 12h2"></path></svg><span>Organizations</span><svg width="14" height="14" viewBox="0 0 16 16"><path d="M6 4l4 4-4 4" fill="none" stroke="#a8aaad" stroke-width="1.5"></path></svg></a>
    <a href="#" class="row"><svg class="i" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="7.5" cy="7" r="2.5"></circle><path d="M3 16c0-2.5 2-4.5 4.5-4.5S12 13.5 12 16"></path><circle cx="14" cy="7.5" r="2"></circle><path d="M13 11.6c2.3.2 4 2 4 4.4"></path></svg><span>People &amp; skills</span><svg width="14" height="14" viewBox="0 0 16 16"><path d="M6 4l4 4-4 4" fill="none" stroke="#a8aaad" stroke-width="1.5"></path></svg></a>

    <div class="cap">Account</div>
    <a href="#" class="row"><svg class="i" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="10" cy="7" r="3"></circle><path d="M4 17c0-3.3 2.7-5.5 6-5.5s6 2.2 6 5.5"></path></svg><span>My profile</span><svg width="14" height="14" viewBox="0 0 16 16"><path d="M6 4l4 4-4 4" fill="none" stroke="#a8aaad" stroke-width="1.5"></path></svg></a>
    <a href="#" class="row"><svg class="i" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M10 2.5 16 5v5c0 3.8-2.6 6.5-6 7.5-3.4-1-6-3.7-6-7.5V5z"></path><path d="M7 10l2 2 4-4"></path></svg><span>Trust &amp; verification</span><svg width="14" height="14" viewBox="0 0 16 16"><path d="M6 4l4 4-4 4" fill="none" stroke="#a8aaad" stroke-width="1.5"></path></svg></a>
    <a href="#" class="row" style="color: #993e38;"><svg class="i" viewBox="0 0 20 20" fill="none" stroke="#993e38" stroke-width="1.5"><path d="M8 3H3v14h5M12 6l4 4-4 4M16 10H7"></path></svg><span>Sign out</span></a>
  </section>

  <nav style="position: absolute; left: 0; right: 0; bottom: 0; display: flex; background: #fafafb; border-top: 1px solid #d0d1d3;">
    <a href="#" class="tab"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M10 18s-6-5.2-6-10a6 6 0 0 1 12 0c0 4.8-6 10-6 10z"></path><circle cx="10" cy="8" r="2"></circle></svg>Field</a>
    <a href="#" class="tab"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 5h5l2 2h7v9H3z"></path></svg>Projects</a>
    <a href="#" class="tab"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="10" cy="10" r="7"></circle><path d="M10 6v4l3 2"></path></svg>Time</a>
    <a href="#" class="tab"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 11l2-7h10l2 7v5H3z"></path><path d="M3 11h4l1 2h4l1-2h4"></path></svg>Inbox</a>
    <a href="#" class="tab on"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 5h14M3 10h14M3 15h14"></path></svg>More</a>
  </nav>

</div>
</x-dc>
</body>
</html>
